[mypy]
python_version = 3.12
ignore_missing_imports = True
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False

# CI runs `mypy api/`, but api/services/job_service.py dispatches Celery
# tasks via local imports from worker.*. Without this, mypy follows
# those imports and starts reporting worker/'s own (separately tracked)
# type errors as part of the api/ check. `silent` still uses worker/'s
# types when checking api/ code, it just stops surfacing errors that
# live inside worker/ itself.
[mypy-worker.*]
follow_imports = silent