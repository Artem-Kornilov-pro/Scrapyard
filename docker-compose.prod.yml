services:
  mongodb:
    image: mongo:7.0
    container_name: scrapyard-mongodb-prod
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: scrapyard
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: scrapyard-redis-prod
    volumes:
      - redis_data:/data
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: scrapyard-api-prod
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - mongodb
      - redis
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: scrapyard-worker-prod
    env_file:
      - .env
    depends_on:
      - mongodb
      - redis
    restart: unless-stopped

  beat:
    build:
      context: .
      dockerfile: docker/Dockerfile.beat
    container_name: scrapyard-beat-prod
    env_file:
      - .env
    depends_on:
      - mongodb
      - redis
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:v1.65.0
    container_name: scrapyard-redis-exporter-prod
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      - redis
    restart: unless-stopped

  celery-exporter:
    image: danihodovic/celery-exporter@sha256:7e4622746e7d07eca0040a476ba4d904383f70ef7f90ef2db68a49bdf4c1b203
    container_name: scrapyard-celery-exporter-prod
    command: ["--broker-url=${REDIS_URL:-redis://redis:6379/0}"]
    depends_on:
      - redis
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.65.0
    container_name: scrapyard-jaeger-prod
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # UI -- put behind auth/firewall in real deployments
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.28.0
    container_name: scrapyard-alertmanager-prod
    volumes:
      - ./docker/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093" # UI -- put behind auth/firewall in real deployments
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: scrapyard-prometheus-prod
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus-alerts.yml:/etc/prometheus/prometheus-alerts.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - api
      - redis-exporter
      - celery-exporter
      - alertmanager
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    container_name: scrapyard-grafana-prod
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD must be set in production}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  mongodb_data:
  redis_data:
  prometheus_data:
  grafana_data: