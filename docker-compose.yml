version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: scrapyard-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: scrapyard

  redis:
    image: redis:7-alpine
    container_name: scrapyard-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: scrapyard-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./api:/app/api
      - ./worker:/app/worker

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: scrapyard-worker
    env_file:
      - .env
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./worker:/app/worker
      - ./api:/app/api

volumes:
  mongodb_data:
  redis_data: