global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/prometheus-alerts.yml

scrape_configs:
  - job_name: scrapyard-api
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: celery
    static_configs:
      - targets: ["celery-exporter:9808"]
